<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['/classrooms']">Classroom</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        @if (isAuthenticated()) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/classrooms']" routerLinkActive="active">Le mie classi</a>
          </li>
        }
      </ul>

      <ul class="navbar-nav ms-auto align-items-lg-center">
        @if (isAuthenticated()) {
          <li class="nav-item me-lg-3">
            <span class="navbar-text">
              Ciao, {{ currentUser()?.fullName }}
              <span class="badge bg-secondary ms-1">
                {{ currentUser()?.role === 'teacher' ? 'Docente' : 'Studente' }}
              </span>
            </span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" (click)="logout()">Logout</button>
          </li>
        } @else {
          <li class="nav-item me-2">
            <a class="btn btn-outline-light btn-sm" [routerLink]="['/register']">Registrati</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary btn-sm" [routerLink]="['/login']">Login</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
