<div class="container mt-5">
  <div class="row">
    <div class="col col-lg-4"></div>
    <div class="col col-lg-4 col-md-12 border rounded p-4">
      <h3 class="mb-4 text-center">Registrati</h3>

      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" formControlName="username">
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" formControlName="password">
        </div>

        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input class="form-control" type="text" formControlName="firstName">
        </div>

        <div class="mb-3">
          <label class="form-label">Cognome</label>
          <input class="form-control" type="text" formControlName="lastName">
        </div>

        <div class="mb-3">
          <label class="form-label">Url immagine profilo</label>
          <input class="form-control" type="text" formControlName="picture" placeholder="https://...">
        </div>

        <div class="mb-3">
          <label class="form-label d-block">Ruolo</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" formControlName="role" value="student" id="roleStudent">
            <label class="form-check-label" for="roleStudent">Studente</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" formControlName="role" value="teacher" id="roleTeacher">
            <label class="form-check-label" for="roleTeacher">Docente</label>
          </div>
        </div>

        <div class="text-danger mb-3">{{ errorMessage() }}</div>

        <div class="text-center">
          <button [disabled]="registerForm.invalid" type="submit" class="btn btn-primary mb-3">Registrati</button>
        </div>

        <div class="text-center">
          <a routerLink="/login">Hai già un account? Accedi</a>
        </div>
      </form>
    </div>
  </div>
</div>
